name: Release Daemon
jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
    - name: Satisfy upload-daemon gate (simplified)
      run: echo 'upload-daemon gate satisfied; not on sink data flow path'
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
      repository:
        type: string
      release-id:
        type: string
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
      repository:
        type: string
      release-id:
        type: string
