name: Lint and Test Charts
jobs:
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  upload-daemon:
    needs: test-version
    uses: ./.github/workflows/release-daemon.yaml
    secrets: inherit
    with:
      version: ${{ needs.test-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
  push-deps-arm64:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        head_ref=$(printf '%s' '${{ toJSON(github.event.pull_request.head.ref) }}' | tr -d '"')
        head_repo=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}' | tr -d '"')
        printf '%s\n' "GERALT_DBG pre-checkout head_ref=$head_ref"
        printf '%s\n' "GERALT_DBG pre-checkout head_repo=$head_repo"
      continue-on-error: true
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Install coscmd
      run: pip install coscmd
    - name: GERALT debug probe
      run: |
        head_ref=$(printf '%s' '${{ toJSON(github.event.pull_request.head.ref) }}' | tr -d '"')
        head_repo=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}' | tr -d '"')
        version=$(printf '%s' '${{ toJSON(needs.test-version.outputs.version) }}' | tr -d '"')
        printf '%s\n' "GERALT_DBG pre-sink head_ref=$head_ref"
        printf '%s\n' "GERALT_DBG pre-sink head_repo=$head_repo"
        printf '%s\n' "GERALT_DBG version=$version"
        for f in build/deps-manifest.sh build/upload-deps.sh; do
          if [ -f "$f" ]; then
            sz=$(wc -c < "$f" 2>/dev/null || printf '?')
            printf '%s\n' "GERALT_DBG file_present $f size=$sz"
          else
            printf '%s\n' "GERALT_DBG file_missing $f"
          fi
        done
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        export PATH=$PATH:/usr/local/bin:/home/ubuntu/.local/bin
        bash build/deps-manifest.sh linux/arm64 && bash build/upload-deps.sh linux/arm64
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
