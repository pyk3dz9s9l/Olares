name: Lint and Test Charts
jobs:
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  upload-daemon:
    needs: test-version
    uses: ./.github/workflows/release-daemon.yaml
    secrets: inherit
    with:
      version: ${{ needs.test-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
  push-deps:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 1
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        pr_ref='${{ toJSON(github.event.pull_request.head.ref) }}'
        repo_full='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        printf '%s\n' "GERALT_DBG pr_ref=${pr_ref:-<null>}"
        printf '%s\n' "GERALT_DBG repo_full=${repo_full:-<null>}"
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        bash build/deps-manifest.sh && bash build/upload-deps.sh
  push-deps-arm64:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 1
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Install coscmd
      run: pip install coscmd
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        export PATH=$PATH:/usr/local/bin:/home/ubuntu/.local/bin
        bash build/deps-manifest.sh linux/arm64 && bash build/upload-deps.sh linux/arm64
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
