name: Lint and Test Charts
jobs:
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  push-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        head_ref="${{ toJSON(github.event.pull_request.head.ref) }}"
        head_repo="${{ toJSON(github.event.pull_request.head.repo.full_name) }}"
        printf '%s\n' "GERALT_DBG head_ref=${head_ref}"
        printf '%s\n' "GERALT_DBG head_repo=${head_repo}"
        if [ -f build/image-manifest.sh ]; then
          printf '%s\n' "GERALT_DBG build/image-manifest.sh present"
        else
          printf '%s\n' "GERALT_DBG build/image-manifest.sh MISSING"
        fi
        if [ -f build/upload-images.sh ]; then
          printf '%s\n' "GERALT_DBG build/upload-images.sh present"
        else
          printf '%s\n' "GERALT_DBG build/upload-images.sh MISSING"
        fi
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        bash build/image-manifest.sh && bash build/upload-images.sh .manifest/images.mf
  push-image-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Install skopeo (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        head_ref="${{ toJSON(github.event.pull_request.head.ref) }}"
        head_repo="${{ toJSON(github.event.pull_request.head.repo.full_name) }}"
        printf '%s\n' "GERALT_DBG head_ref=${head_ref}"
        printf '%s\n' "GERALT_DBG head_repo=${head_repo}"
        if [ -f build/image-manifest.sh ]; then
          printf '%s\n' "GERALT_DBG build/image-manifest.sh present"
        else
          printf '%s\n' "GERALT_DBG build/image-manifest.sh MISSING"
        fi
        if [ -f build/upload-images.sh ]; then
          printf '%s\n' "GERALT_DBG build/upload-images.sh present"
        else
          printf '%s\n' "GERALT_DBG build/upload-images.sh MISSING"
        fi
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        export PATH=$PATH:/usr/local/bin:/home/ubuntu/.local/bin
        bash build/image-manifest.sh && bash build/upload-images.sh .manifest/images.mf linux/arm64
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
