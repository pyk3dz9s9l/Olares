name: Lint and Test Charts
jobs:
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  upload-package:
    needs:
    - test-version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: upload-package before 'Package installer'"
        head_ref='${{ toJSON(github.event.pull_request.head.ref) }}'
        head_repo='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        printf '%s\n' "GERALT_DBG head_ref=${head_ref}"
        printf '%s\n' "GERALT_DBG head_repo=${head_repo}"
        if [ -f build/build.sh ]; then
          printf '%s\n' 'GERALT_DBG build/build.sh present'
        else
          printf '%s\n' 'GERALT_DBG build/build.sh missing'
        fi
      continue-on-error: true
    - name: Package installer
      run: |
        bash build/build.sh ${{ needs.test-version.outputs.version }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: upload-package before 'Upload package'"
        version='${{ toJSON(needs.test-version.outputs.version) }}'
        printf '%s\n' "GERALT_DBG version=${version}"
        f="install-wizard-v${version}.tar.gz"
        if [ -f "$f" ]; then
          printf '%s\n' "GERALT_DBG artifact present: ${f}"
        else
          printf '%s\n' "GERALT_DBG artifact missing: ${f}"
        fi
      continue-on-error: true
    - name: Upload package
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        md5sum install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz > install-wizard-v${{ needs.test-version.outputs.version }}.md5sum.txt && \
        aws s3 cp install-wizard-v${{ needs.test-version.outputs.version }}.md5sum.txt s3://terminus-os-install/install-wizard-v${{ needs.test-version.outputs.version }}.md5sum.txt --acl=public-read && \
        aws s3 cp install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz s3://terminus-os-install/install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz --acl=public-read
  install-test:
    needs:
    - test-version
    - upload-package
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: install-test before 'Deploy Request'"
        version='${{ toJSON(needs.test-version.outputs.version) }}'
        printf '%s\n' "GERALT_DBG version=${version}"
        printf '%s\n' "GERALT_DBG downloadUrl=https://cdn.olares.com/install-wizard-v${version}.tar.gz"
      continue-on-error: true
    - name: Deploy Request
      uses: fjogeleit/http-request-action@v1
      with:
        url: https://cloud-dev-api.bttcdn.com/v1/resource/installTest
        method: POST
        customHeaders: '{"Authorization": "${{ secrets.INSTALL_SECRET }}"}'
        data: versions=${{ needs.test-version.outputs.version }}&downloadUrl=https://cdn.olares.com/install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz
        contentType: application/x-www-form-urlencoded
    - name: Check Result
      uses: eball/poll-check-endpoint@v0.1.0
      with:
        url: https://cloud-dev-api.bttcdn.com/v1/resource/installResult
        method: POST
        expectStatus: 200
        failedBodyRegex: '"installedAt":"[0-9]{10,}".*"isSuccess":false'
        expectBodyRegex: '"isSuccess":true'
        timeout: 1800000
        interval: 30000
        customHeaders: '{"Authorization": "${{ secrets.INSTALL_SECRET }}", "Content-Type": "application/x-www-form-urlencoded"}'
        data: versions=${{ needs.test-version.outputs.version }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
