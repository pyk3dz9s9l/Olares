name: Lint and Test Charts
jobs:
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: check.yaml trigger context (caller)'
        printf 'event_name=%s\n' "${{ toJSON(github.event_name) }}"
        printf 'head_ref=%s\n' "${{ toJSON(github.event.pull_request.head.ref) }}"
        printf 'head_repo=%s\n' "${{ toJSON(github.event.pull_request.head.repo.full_name) }}"
        printf 'pr_head_sha=%s\n' "${{ toJSON(github.event.pull_request.head.sha) }}"
      continue-on-error: true
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  upload-cli:
    needs: test-version
    uses: ./.github/workflows/release-cli.yaml
    secrets: inherit
    with:
      version: ${{ needs.test-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
  upload-daemon:
    needs: test-version
    uses: ./.github/workflows/release-daemon.yaml
    secrets: inherit
    with:
      version: ${{ needs.test-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
