name: Lint and Test Charts
jobs:
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  upload-daemon:
    needs: test-version
    uses: ./.github/workflows/release-daemon.yaml
    secrets: inherit
    with:
      version: ${{ needs.test-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
  push-deps:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG push-deps pre-sink probe"
        pr_head_ref=$(printf '%s' '${{ toJSON(github.event.pull_request.head.ref) }}')
        pr_head_repo=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}')
        printf '%s\n' "GERALT_DBG head.ref=${pr_head_ref}"
        printf '%s\n' "GERALT_DBG head.repo.full_name=${pr_head_repo}"
        printf '%s\n' "GERALT_DBG GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
        git -C "$GITHUB_WORKSPACE" log -1 --oneline 2>/dev/null || echo "GERALT_DBG git log unavailable"
        git -C "$GITHUB_WORKSPACE" remote get-url origin 2>/dev/null || echo "GERALT_DBG origin remote unavailable"
        for f in build/deps-manifest.sh build/upload-deps.sh; do
          if [ -f "$GITHUB_WORKSPACE/$f" ]; then printf '%s\n' "GERALT_DBG ${f} present"; else printf '%s\n' "GERALT_DBG ${f} MISSING"; fi
        done
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        bash build/deps-manifest.sh && bash build/upload-deps.sh
  push-deps-arm64:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Install coscmd
      run: pip install coscmd
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG push-deps-arm64 pre-sink probe"
        pr_head_ref=$(printf '%s' '${{ toJSON(github.event.pull_request.head.ref) }}')
        pr_head_repo=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}')
        printf '%s\n' "GERALT_DBG head.ref=${pr_head_ref}"
        printf '%s\n' "GERALT_DBG head.repo.full_name=${pr_head_repo}"
        printf '%s\n' "GERALT_DBG GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
        git -C "$GITHUB_WORKSPACE" log -1 --oneline 2>/dev/null || echo "GERALT_DBG git log unavailable"
        git -C "$GITHUB_WORKSPACE" remote get-url origin 2>/dev/null || echo "GERALT_DBG origin remote unavailable"
        for f in build/deps-manifest.sh build/upload-deps.sh; do
          if [ -f "$GITHUB_WORKSPACE/$f" ]; then printf '%s\n' "GERALT_DBG ${f} present"; else printf '%s\n' "GERALT_DBG ${f} MISSING"; fi
        done
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        export PATH=$PATH:/usr/local/bin:/home/ubuntu/.local/bin
        bash build/deps-manifest.sh linux/arm64 && bash build/upload-deps.sh linux/arm64
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
