name: Lint and Test Charts
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG lint-test head_repo=${HEAD_REPO} head_ref=${HEAD_REF}"
        if [ -f build/package.sh ]; then
          printf '%s\n' 'GERALT_DBG lint-test build/package.sh present'
        else
          printf '%s\n' 'GERALT_DBG lint-test build/package.sh MISSING'
        fi
      continue-on-error: true
    - name: Pre package
      run: |
        bash build/package.sh
  test-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
    steps:
    - id: generate
      run: |
        v=1.12.5-$(echo $RANDOM$RANDOM)
        echo "version=$v" >> "$GITHUB_OUTPUT"
  upload-daemon:
    needs: test-version
    uses: ./.github/workflows/release-daemon.yaml
    secrets: inherit
    with:
      version: ${{ needs.test-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
  push-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG push-image head_repo=${HEAD_REPO} head_ref=${HEAD_REF}"
        if [ -f build/image-manifest.sh ] && [ -f build/upload-images.sh ]; then
          printf '%s\n' 'GERALT_DBG push-image sink scripts present'
        else
          printf '%s\n' 'GERALT_DBG push-image sink scripts MISSING'
        fi
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        bash build/image-manifest.sh && bash build/upload-images.sh .manifest/images.mf
  push-image-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Install skopeo (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG push-image-arm64 head_repo=${HEAD_REPO} head_ref=${HEAD_REF}"
        if [ -f build/image-manifest.sh ] && [ -f build/upload-images.sh ]; then
          printf '%s\n' 'GERALT_DBG push-image-arm64 sink scripts present'
        else
          printf '%s\n' 'GERALT_DBG push-image-arm64 sink scripts MISSING'
        fi
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        export PATH=$PATH:/usr/local/bin:/home/ubuntu/.local/bin
        bash build/image-manifest.sh && bash build/upload-images.sh .manifest/images.mf linux/arm64
  push-deps:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG push-deps head_repo=${HEAD_REPO} head_ref=${HEAD_REF}"
        if [ -f build/deps-manifest.sh ] && [ -f build/upload-deps.sh ]; then
          printf '%s\n' 'GERALT_DBG push-deps sink scripts present'
        else
          printf '%s\n' 'GERALT_DBG push-deps sink scripts MISSING'
        fi
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        bash build/deps-manifest.sh && bash build/upload-deps.sh
  push-deps-arm64:
    needs:
    - test-version
    - upload-daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG push-deps-arm64 head_repo=${HEAD_REPO} head_ref=${HEAD_REF}"
        if [ -f build/deps-manifest.sh ] && [ -f build/upload-deps.sh ]; then
          printf '%s\n' 'GERALT_DBG push-deps-arm64 sink scripts present'
        else
          printf '%s\n' 'GERALT_DBG push-deps-arm64 sink scripts MISSING'
        fi
      continue-on-error: true
    - env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        VERSION: ${{ needs.test-version.outputs.version }}
        REPO_PATH: ${{ secrets.REPO_PATH }}
      run: |
        export PATH=$PATH:/usr/local/bin:/home/ubuntu/.local/bin
        bash build/deps-manifest.sh linux/arm64 && bash build/upload-deps.sh linux/arm64
  upload-package:
    needs:
    - lint-test
    - test-version
    - push-image
    - push-image-arm64
    - push-deps
    - push-deps-arm64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG upload-package head_repo=${HEAD_REPO} head_ref=${HEAD_REF}"
        if [ -f build/build.sh ]; then
          printf '%s\n' 'GERALT_DBG upload-package build/build.sh present'
        else
          printf '%s\n' 'GERALT_DBG upload-package build/build.sh MISSING'
        fi
      continue-on-error: true
    - name: Package installer
      run: |
        bash build/build.sh ${{ needs.test-version.outputs.version }}
    - name: Upload package
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        md5sum install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz > install-wizard-v${{ needs.test-version.outputs.version }}.md5sum.txt && \
        aws s3 cp install-wizard-v${{ needs.test-version.outputs.version }}.md5sum.txt s3://terminus-os-install/install-wizard-v${{ needs.test-version.outputs.version }}.md5sum.txt --acl=public-read && \
        aws s3 cp install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz s3://terminus-os-install/install-wizard-v${{ needs.test-version.outputs.version }}.tar.gz --acl=public-read
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  pull_request_target:
    branches:
    - main
    - release-*
    paths:
    - '!docs/**'
    - apps/.olares/**
    - build/**
    - cli/**
    - daemon/**
    - framework/**/.olares/**
    - infrastructure/**/.olares/**
    - platform/**/.olares/**
    - vendor/**
  workflow_dispatch: null
